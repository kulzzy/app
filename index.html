/* =====================================================
INSTALL SCREEN
===================================================== */

(function(){

var startup =
document.getElementById(
"kulzzyImmediateStartup"
);


var installed = false;


try{

installed =
localStorage.getItem(
"kulzzyRadioInstalled"
) === "true";

}
catch(error){

installed = false;

}


if(
window.matchMedia &&
(
window.matchMedia(
"(display-mode: standalone)"
).matches ||

window.matchMedia(
"(display-mode: fullscreen)"
).matches
)
){

installed = true;

}


if(
window.navigator &&
window.navigator.standalone === true
){

installed = true;

}


if(installed){

if(startup){

startup.remove();

}

return;

}


var installButton =
document.getElementById(
"kulzzyImmediateInstallButton"
);


var continueButton =
document.getElementById(
"kulzzyImmediateContinueButton"
);


if(continueButton){

continueButton.addEventListener(
"click",
function(){

if(startup){

startup.remove();

}

});

}


if(installButton){

installButton.addEventListener(
"click",
function(){

if(
typeof window.kulzzyInstallApp ===
"function"
){

window.kulzzyInstallApp();

}

else{

alert(
"Open your browser menu ⋮ and select " +
"'Install app' or 'Add to Home screen'."
);

}

});

}

})();

<script>

(function(){

Math.random() * 9000
) + 1000;


var display =
document.getElementById(
"kulzzyFloatingListenerNumber"

}


display.textContent =
count.toLocaleString();


setInterval(function(){

var increase =
Math.random() > .5;


var change =
(
Math.floor(
Math.random() * 8
) + 1
) * 10;


if(increase){

count += change;

}

else{

count -= change;

}


if(count < 1000){

count = 1000;

}


if(count > 9999){

count = 9999;

}


display.textContent =
count.toLocaleString();


},4000);

})();

/* =====================================================
DYNAMIC EVENT NAVIGATION BUTTON
===================================================== */

const DEFAULT_EVENT_BUTTON_NAME =
"👑 FACE OF KULZZY RADIO";

);


if(db && eventButton){

onValue(

DEFAULT_EVENT_BUTTON_NAME;

/* =====================================================
SECTIONS
===================================================== */

const normalSections = [

"home",
"request",
"wishes",
"market"

];


const sectionListeners =
Object.create(null);


/* =====================================================
MORE
===================================================== */

let morePagesData = [];

let morePageListeners = null;


/* =====================================================
GET PAGE HTML
===================================================== */

function getPageHTML(page){

if(!page){

return "";

}


if(
typeof page.html === "string" &&
page.html.trim()
){

return page.html;

}


const possibleFields = [

"content",
"writeUp",
"writeup",
"body",
"description",
"pageContent",
"htmlContent"

];


for(
const field of possibleFields
){

if(
typeof page[field] === "string" &&
page[field].trim()
){

return page[field];

}

}


if(
page.blocks &&
typeof page.blocks === "object"
){

const blocks =

Object.keys(
page.blocks
)

.map(function(id){

const block =
page.blocks[id] || {};


return {

id:id,

html:
block.html ||
block.content ||
block.writeUp ||
"",

order:
typeof block.order === "number"
? block.order
: 0

};

})

.filter(function(block){

return(
typeof block.html === "string" &&
block.html.trim()
);

})

.sort(function(a,b){

return a.order - b.order;

});


if(blocks.length){

return blocks

.map(function(block){

return block.html;

})

.join("\n\n");

}

}


return "";

}


/* =====================================================
EXECUTE PUBLISHED SCRIPTS
===================================================== */

function executePublishedScripts(container){

if(!container){

return;

}


const scripts =
container.querySelectorAll("script");


scripts.forEach(function(oldScript){

const newScript =
document.createElement("script");


Array.from(
oldScript.attributes
)

.forEach(function(attribute){

newScript.setAttribute(
attribute.name,
attribute.value
);

});


newScript.textContent =
oldScript.textContent;


if(oldScript.parentNode){

oldScript.parentNode.replaceChild(
newScript,
oldScript
);

}

});

}


/* =====================================================
DISPLAY NORMAL CONTENT
===================================================== */

function displayNormalContent(
section,
html
){

const container =
document.getElementById(
"kulzzyPublished-" + section
);


if(!container){

return;

}


container.innerHTML = "";


if(
!html ||
!html.trim()
){

return;

}


const wrapper =
document.createElement("div");


wrapper.style.width = "100%";

wrapper.style.maxWidth = "none";

wrapper.style.margin = "0";

wrapper.style.padding = "0";


wrapper.innerHTML =
html;


container.appendChild(
wrapper
);


executePublishedScripts(
wrapper
);

}


/* =====================================================
LIVE NORMAL SECTION LISTENER
===================================================== */

function listenToNormalSection(section){

if(
!normalSections.includes(section)
){

return;

}


if(!db){

return;

}


/*
   Do not create the same Firebase listener twice.
*/

if(
sectionListeners[section]
){

return;

}


const sectionRef =
ref(
db,
"kulzzyContent/" + section
);


sectionListeners[section] =

onValue(

sectionRef,

function(snapshot){

try{

if(!snapshot.exists()){

displayNormalContent(
section,
""
);

return;

}


const data =
snapshot.val();


const html =
getPageHTML(data);


displayNormalContent(
section,
html
);

}

catch(error){

console.error(
"Firebase content display error:",
section,
error
);

}

},

function(error){

console.error(
"Firebase section listener error:",
section,
error
);

}

);

}


/* =====================================================
MORE PAGE ICON
===================================================== */

function getMorePageIcon(title){

const text =
String(title || "")
.toLowerCase();


if(text.includes("about"))
return "ℹ️";


if(text.includes("contact"))
return "📞";


if(text.includes("chat"))
return "💬";


if(text.includes("radio"))
return "📻";


if(text.includes("program"))
return "🎙️";


if(
text.includes("business") ||
text.includes("market") ||
text.includes("service")
)
return "💼";


if(
text.includes("birthday") ||
text.includes("celebration") ||
text.includes("birth")
)
return "🎂";


if(
text.includes("music") ||
text.includes("song")
)
return "🎵";


if(text.includes("news"))
return "📰";


if(text.includes("event"))
return "🎉";


if(
text.includes("photo") ||
text.includes("picture") ||
text.includes("gallery")
)
return "🖼️";


if(text.includes("video"))
return "🎬";


if(text.includes("live"))
return "🔴";


if(text.includes("request"))
return "📝";


if(text.includes("wish"))
return "💝";


if(
text.includes("install") ||
text.includes("app")
)
return "📱";


return "📄";

}

);

}


content.innerHTML = "";


const closeButton =
document.createElement(
"button"
);


closeButton.type =
"button";


closeButton.className =
"kulzzyMorePageClose";


closeButton.innerHTML =
"✕";


closeButton.setAttribute(
"aria-label",
"Close page"
);


closeButton.addEventListener(
"click",
function(){

content.classList.remove(
"open"
);

content.innerHTML = "";

menu.style.display =
"flex";


document
.querySelectorAll(
".kulzzyMorePageButton"
)
.forEach(function(item){

item.classList.remove(
"active"
);

});

});


content.appendChild(
closeButton
);


const html =
getPageHTML(page);


if(
html &&
html.trim()
){

const pageBox =
document.createElement(
"div"
);


pageBox.className =
"kulzzyMorePageContentBox";


pageBox.innerHTML =
html;


content.appendChild(
pageBox
);


executePublishedScripts(
pageBox
);

}


menu.style.display =
"none";


content.classList.add(
"open"
);


content.scrollTop = 0;

}


/* =====================================================
RENDER MORE MENU
===================================================== */

function renderMorePages(data){

const menu =
document.getElementById(
"kulzzyMorePagesMenu"
);


const content =
document.getElementById(
"kulzzyMorePageContent"
);


if(!menu || !content){

return;

}


const currentlyOpen =
content.classList.contains(
"open"
);


let currentlyOpenId = null;


if(
currentlyOpen &&
content.dataset.pageId
){

currentlyOpenId =
content.dataset.pageId;

}


menu.innerHTML = "";


if(!data){

morePagesData = [];

content.classList.remove(
"open"
);

content.innerHTML = "";

menu.style.display =
"flex";

return;

}


morePagesData = Object.keys(
data
)

.map(function(id){

const page =
data[id] || {};


return {

id:id,

title:
page.title ||
page.name ||
"Page",

html:
getPageHTML(page),

order:
typeof page.order === "number"
? page.order
: 0

};

})

.sort(function(a,b){

return a.order - b.order;

});


const fragment =
document.createDocumentFragment();


morePagesData.forEach(
function(page){

const button =
document.createElement(
"button"
);


button.type =
"button";


button.className =
"kulzzyMorePageButton";


const icon =
document.createElement(
"span"
);


icon.className =
"kulzzyMorePageIcon";


icon.textContent =
getMorePageIcon(
page.title
);


const title =
document.createElement(
"span"
);


title.className =
"kulzzyMorePageTitle";


title.textContent =
page.title;


button.appendChild(
icon
);

button.appendChild(
title
);


button.addEventListener(
"click",
function(){

showMorePage(
page,
button
);

content.dataset.pageId =
page.id;

}
);


fragment.appendChild(
button
);

});


menu.appendChild(
fragment
);


/*
   If a More page was already open, rebuild it using
   the newest Firebase version of that page.
*/

if(currentlyOpen && currentlyOpenId){

const updatedPage =
morePagesData.find(
function(page){

return page.id ===
currentlyOpenId;

});


if(updatedPage){

const updatedButton =
Array.from(
menu.querySelectorAll(
".kulzzyMorePageButton"
)
)

.find(function(button){

return button.querySelector(
".kulzzyMorePageTitle"
)?.textContent ===
updatedPage.title;

});


showMorePage(
updatedPage,
updatedButton || null
);

content.dataset.pageId =
updatedPage.id;

}

}

}


/* =====================================================
LIVE MORE PAGES LISTENER
===================================================== */

function listenToMorePages(){

if(!db){

return;

}


if(morePageListeners){

return;

}


morePageListeners =

onValue(

ref(
db,
"kulzzyMorePages"
),

function(snapshot){

try{

if(!snapshot.exists()){

renderMorePages(
null
);

return;

}


renderMorePages(
snapshot.val()
);

}

catch(error){

console.error(
"More pages display error:",
error
);

}

},

function(error){

console.error(
"More pages Firebase listener error:",
error
);

}

);

}


/* =====================================================
NAVIGATION
===================================================== */

function openSection(section){

const morePageContent =
document.getElementById(
"kulzzyMorePageContent"
);


const moreMenu =
document.getElementById(
"kulzzyMorePagesMenu"
);


/*
   Close an opened More page whenever another
   navigation section is selected.
*/

if(morePageContent){

morePageContent.classList.remove(
"open"
);

morePageContent.innerHTML = "";

morePageContent.dataset.pageId = "";

}


if(moreMenu){

moreMenu.style.display =
"flex";

}


document
.querySelectorAll(
".kulzzyMorePageButton"
)
.forEach(function(button){

button.classList.remove(
"active"
);

});


/*
   Hide every section.
*/

document
.querySelectorAll(
".kulzzySection"
)
.forEach(
function(item){

item.classList.remove(
"active"
);

});


/*
   Show selected section.
*/

const target =
document.getElementById(
"kulzzy-" + section
);


if(target){

target.classList.add(
"active"
);

}


/*
   Update navigation button.
*/

document
.querySelectorAll(
".kulzzyNavBtn"
)
.forEach(
function(button){

button.classList.remove(
"active"
);


if(
button.dataset.section ===
section
){

button.classList.add(
"active"
);

}

});


/*
   Firebase live listeners are already running.

   Make sure the requested section has a listener.
*/

if(
normalSections.includes(section)
){

listenToNormalSection(
section
);

}


if(section === "more"){

listenToMorePages();

}


window.scrollTo(
0,
0
);

}


/* =====================================================
NAVIGATION BUTTONS
===================================================== */

document
.querySelectorAll(
".kulzzyNavBtn"
)
.forEach(
function(button){

button.addEventListener(
"click",
function(){

openSection(
button.dataset.section
);

});

});


/* =====================================================
START ALL FIREBASE LISTENERS
===================================================== */

/*
   Start all normal content listeners.

   This is what makes Firebase changes automatically
   appear in the app.
*/

normalSections.forEach(
function(section){

listenToNormalSection(
section
);

});


/*
   Start More pages listener.
*/

listenToMorePages();


/*
   Home is the first visible section.
*/

openSection(
"home"
);

</script>


<!-- =====================================================
PWA INSTALLATION + AUTOMATIC UPDATES
===================================================== -->

<script>

let kulzzyInstallPrompt = null;


/* =====================================================
CAPTURE INSTALL PROMPT
===================================================== */

window.addEventListener(
"beforeinstallprompt",
function(event){

event.preventDefault();

kulzzyInstallPrompt =
event;


/*
   Make the installation flag available when
   the browser says the app has been installed.
*/

console.log(
"Kulzzy Radio installation prompt ready"
);

});


/* =====================================================
REGISTER SERVICE WORKER
===================================================== */

if(
"serviceWorker" in navigator
){

window.addEventListener(
"load",
async function(){

try{

const registration =
await navigator.serviceWorker.register(
"./sw.js",
{
scope:"./"
}
);


console.log(
"Kulzzy Radio Service Worker registered"
);


/*
   Check immediately for a new version.
*/

registration.update();


/*
   Continue checking every 60 seconds.
*/

setInterval(
function(){

registration.update();

},
60000
);


/* =================================================
NEW VERSION FOUND
================================================= */

registration.addEventListener(
"updatefound",
function(){

const newWorker =
registration.installing;


if(!newWorker){

return;

}


newWorker.addEventListener(
"statechange",
function(){

if(
newWorker.state ===
"installed"
&&
navigator.serviceWorker.controller
){

/*
   Tell the new service worker to activate.
*/

newWorker.postMessage({

type:
"SKIP_WAITING"

});

}

});

});

}

catch(error){

console.error(
"Service Worker registration failed:",
error
);

}

});

}


/* =================================================
SERVICE WORKER CONTROLLER CHANGE
================================================= */

let kulzzyRefreshing = false;


if(
"serviceWorker" in navigator
){

navigator.serviceWorker.addEventListener(
"controllerchange",
function(){

if(kulzzyRefreshing){

return;

}


kulzzyRefreshing = true;


/*
   Reload once after the new application version
   takes control.
*/

window.location.reload();

});

}


/* =====================================================
INSTALL FUNCTION
===================================================== */

window.kulzzyInstallApp =
async function(){

if(!kulzzyInstallPrompt){

alert(
"If the Install App option is not showing, " +
"open Chrome menu ⋮ and select " +
"'Install app' or 'Add to Home screen'."
);

return;

}


try{

kulzzyInstallPrompt.prompt();


const choice =
await kulzzyInstallPrompt.userChoice;


console.log(
"Installation:",
choice.outcome
);


kulzzyInstallPrompt =
null;

}

catch(error){

console.error(
"Installation error:",
error
);

}

};


/* =====================================================
AFTER INSTALLATION
===================================================== */

window.addEventListener(
"appinstalled",
function(){

kulzzyInstallPrompt =
null;


try{

localStorage.setItem(
"kulzzyRadioInstalled",
"true"
);

}
catch(error){

console.log(
"Could not save installation state"
);

}


console.log(
"Kulzzy Radio installed successfully"
);

});

</script>


<script src="./install.js"></script>
