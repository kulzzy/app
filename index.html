(function(){

var startup =
    document.getElementById(
        "kulzzyImmediateStartup"
    );


/* =====================================================
   CHECK IF KULZZY RADIO IS ALREADY INSTALLED
===================================================== */

var installed = false;

try{

    installed =
        localStorage.getItem(
            "kulzzyRadioInstalled"
        ) === "true";

}
catch(error){

    installed = false;

}


if(
    window.matchMedia &&
    (
        window.matchMedia(
            "(display-mode: standalone)"
        ).matches ||

        window.matchMedia(
            "(display-mode: fullscreen)"
        ).matches
    )
){

    installed = true;

}


if(
    window.navigator &&
    window.navigator.standalone === true
){

    installed = true;

}


/* =====================================================
   IF ALREADY INSTALLED
   REMOVE INSTALLATION BOX IMMEDIATELY
===================================================== */

if(installed){

    if(startup){

        startup.remove();

    }

    return;

}


/* =====================================================
   INSTALL / CONTINUE BUTTONS
===================================================== */

var installButton =
    document.getElementById(
        "kulzzyImmediateInstallButton"
    );

var continueButton =
    document.getElementById(
        "kulzzyImmediateContinueButton"
    );


if(continueButton){

    continueButton.addEventListener(
        "click",
        function(){

            if(startup){

                startup.remove();

            }

        }
    );

}


if(installButton){

    installButton.addEventListener(
        "click",
        function(){

            if(
                typeof window.kulzzyInstallApp ===
                "function"

                window.kulzzyInstallApp();

            else{

                alert(

}

/* =====================================================

const DEFAULT_EVENT_BUTTON_NAME =

function updateEventButtonName(

if(

}

/* =====================================================

const normalSections = [

"wishes",
"market"

];

const loadedSections =

/* =====================================================

let morePagesLoaded = false;

let morePagesData = [];

/* =====================================================
GET PAGE HTML
===================================================== */

function getPageHTML(page){

if(!page){

    return "";

}


if(
    typeof page.html === "string" &&
    page.html.trim()
){

    return page.html;

}


const possibleFields = [

    "content",
    "writeUp",
    "writeup",
    "body",
    "description",
    "pageContent",
    "htmlContent"

];


for(
    const field of possibleFields
){

    if(
        typeof page[field] === "string" &&
        page[field].trim()
    ){

        return page[field];

    }

}


if(
    page.blocks &&
    typeof page.blocks === "object"
){

    const blocks =

        Object.keys(
            page.blocks
        )

        .map(function(id){

            const block =
                page.blocks[id] || {};


            return {

                id:id,

                html:
                    block.html ||
                    block.content ||
                    block.writeUp ||
                    "",

                order:
                    typeof block.order === "number"
                    ? block.order
                    : 0

            };

        })

        .filter(function(block){

            return(
                typeof block.html === "string" &&
                block.html.trim()
            );

        })

        .sort(function(a,b){

            return a.order - b.order;

        });


    if(blocks.length){

        return blocks
            .map(function(block){

                return block.html;

            })

            .join("\n\n");

    }

}


return "";

}

/* =====================================================
EXECUTE PUBLISHED SCRIPTS
===================================================== */

function executePublishedScripts(container){

if(!container){

    return;

}


const scripts =
    container.querySelectorAll("script");


scripts.forEach(function(oldScript){

    const newScript =
        document.createElement("script");


    Array.from(
        oldScript.attributes
    )
    .forEach(function(attribute){

        newScript.setAttribute(
            attribute.name,
            attribute.value
        );

    });


    newScript.textContent =
        oldScript.textContent;


    if(oldScript.parentNode){

        oldScript.parentNode.replaceChild(
            newScript,
            oldScript
        );

    }

});

}

/* =====================================================
DISPLAY NORMAL CONTENT
===================================================== */

function displayNormalContent(
section,
html
){

const container =
    document.getElementById(
        "kulzzyPublished-" + section
    );


if(!container){

    return;

}


if(
    !html ||
    !html.trim()
){

    loadedSections[section] = true;

    return;

}


const wrapper =
    document.createElement("div");


wrapper.innerHTML =
    html;


container.innerHTML =
    "";


container.appendChild(
    wrapper
);


executePublishedScripts(
    wrapper
);


loadedSections[section] =
    true;

}

/* =====================================================
LOAD NORMAL SECTION
===================================================== */

async function loadNormalSection(section){

if(
    !normalSections.includes(section)
){

    return;

}


if(
    loadedSections[section]
){

    return;

}


if(
    loadingSections[section]
){

    return loadingSections[section];

}


if(!db){

    console.error(
        "Firebase database is not available."
    );

    return;

}


loadingSections[section] =

    (async function(){

        try{

            const snapshot =
                await get(
                    ref(
                        db,
                        "kulzzyContent/" + section
                    )
                );


            if(
                snapshot.exists()
            ){

                const data =
                    snapshot.val();


                const html =
                    getPageHTML(data);


                displayNormalContent(
                    section,
                    html
                );

            }

            else{

                loadedSections[section] =
                    true;

            }

        }

        catch(error){

            console.error(
                "Firebase section error:",
                section,
                error
            );

        }

    })();


try{

    await loadingSections[section];

}

finally{

    delete loadingSections[section];

}

}

/* =====================================================
MORE PAGES LOADER
===================================================== */

async function loadMorePages(){

if(morePagesLoaded){

    return;

}


if(morePagesLoading){

    return morePagesLoading;

}


if(!db){

    return;

}


morePagesLoading =

    (async function(){

        try{

            const snapshot =
                await get(
                    ref(
                        db,
                        "kulzzyMorePages"
                    )
                );


            const menu =
                document.getElementById(
                    "kulzzyMorePagesMenu"
                );


            if(!menu){

                return;

            }


            menu.innerHTML =
                "";


            if(!snapshot.exists()){

                morePagesLoaded = true;

                return;

            }


            const data =
                snapshot.val();


            morePagesData = [];


            Object.keys(data || {})
                .forEach(function(id){

                    const page =
                        data[id] || {};


                    morePagesData.push({

                        id:id,

                        title:
                            page.title ||
                            page.name ||
                            "Page",

                        html:
                            getPageHTML(page),

                        order:
                            typeof page.order === "number"
                            ? page.order
                            : 0

                    });

                });


            morePagesData.sort(
                function(a,b){

                    return a.order - b.order;

                }
            );


            morePagesData.forEach(
                function(page,index){

                    const button =
                        document.createElement(
                            "button"
                        );


                    button.type =
                        "button";


                    button.className =
                        "kulzzyMorePageButton";


                    button.textContent =
                        page.title;


                    button.addEventListener(
                        "click",
                        function(){

                            document
                                .querySelectorAll(
                                    ".kulzzyMorePageButton"
                                )
                                .forEach(
                                    function(btn){

                                        btn.classList.remove(
                                            "active"
                                        );

                                    }
                                );


                            button.classList.add(
                                "active"
                            );


                            const content =
                                document.getElementById(
                                    "kulzzyMorePageContent"
                                );


                            if(!content){

                                return;

                            }


                            content.innerHTML = "";


                            const box =
                                document.createElement(
                                    "div"
                                );


                            box.className =
                                "kulzzyMorePageContentBox";


                            box.innerHTML =
                                page.html || "";


                            content.appendChild(
                                box
                            );


                            executePublishedScripts(
                                box
                            );

                        }
                    );


                    menu.appendChild(
                        button
                    );


                    if(index === 0){

                        button.click();

                    }

                }
            );


            morePagesLoaded = true;

        }

        catch(error){

            console.error(
                "More pages error:",
                error
            );

        }

    })();


try{

    await morePagesLoading;

}

finally{

    morePagesLoading = false;

}

}

/* =====================================================
NAVIGATION
===================================================== */

function openSection(section){

document
    .querySelectorAll(
        ".kulzzySection"
    )
    .forEach(
        function(item){

            item.classList.remove(
                "active"
            );

        }
    );


const target =
    document.getElementById(
        "kulzzy-" + section
    );


if(target){

    target.classList.add(
        "active"
    );

}


document
    .querySelectorAll(
        ".kulzzyNavBtn"
    )
    .forEach(
        function(button){

            button.classList.remove(
                "active"
            );


            if(
                button.dataset.section ===
                section
            ){

                button.classList.add(
                    "active"
                );

            }

        }
    );


if(
    normalSections.includes(section)
){

    loadNormalSection(
        section
    );

}


if(section === "more"){

    loadMorePages();

}


window.scrollTo(
    0,
    0
);

}

/* =====================================================
NAVIGATION BUTTONS
===================================================== */

document
.querySelectorAll(
".kulzzyNavBtn"
)
.forEach(
function(button){

        button.addEventListener(
            "click",
            function(){

                openSection(
                    button.dataset.section
                );

            }
        );

    }
);

/* =====================================================
LOAD HOME FIRST
===================================================== */

loadNormalSection(
"home"
);

</script><!-- =====================================================
PWA INSTALLATION + AUTOMATIC UPDATES
===================================================== --><script>

let kulzzyInstallPrompt = null;

/* =====================================================
REGISTER SERVICE WORKER
===================================================== */

if(
"serviceWorker" in navigator
){

window.addEventListener(
    "load",
    async function(){

        try{

            const registration =
                await navigator.serviceWorker.register(
                    "./sw.js",
                    {
                        scope: "./"
                    }
                );


            console.log(
                "Kulzzy Radio Service Worker registered"
            );


            /* CHECK FOR NEW VERSION */

            registration.update();


            /* CHECK EVERY 60 SECONDS */

            setInterval(
                function(){

                    registration.update();

                },
                60000
            );

            /* =================================================
               NEW VERSION FOUND
            ================================================= */

            registration.addEventListener(
                "updatefound",
                function(){

                    const newWorker =
                        registration.installing;


                    if(!newWorker){

                        return;

                    }


                    newWorker.addEventListener(
                        "statechange",
                        function(){

                            if(
                                newWorker.state ===
                                "installed" &&
                                navigator.serviceWorker.controller
                            ){

                                newWorker.postMessage({

                                    action:
                                        "SKIP_WAITING"

                                });

                            }

                        }
                    );

                }
            );

        }

        catch(error){

            console.error(
                "Service Worker registration failed:",
                error
            );

        }

    }
);


/* =================================================
   AUTOMATIC REFRESH
================================================= */

let kulzzyRefreshing = false;


navigator.serviceWorker.addEventListener(
    "controllerchange",
    function(){

        if(kulzzyRefreshing){

            return;

        }


        kulzzyRefreshing = true;


        window.location.reload();

    }
);

}

/* =====================================================
INSTALL FUNCTION
===================================================== */

window.kulzzyInstallApp =
async function(){

    if(!kulzzyInstallPrompt){

        alert(
            "If the Install App option is not showing, " +
            "open Chrome menu ⋮ and select " +
            "'Install app' or 'Add to Home screen'."
        );

        return;

    }


    kulzzyInstallPrompt.prompt();


    const choice =
        await kulzzyInstallPrompt.userChoice;


    console.log(
        "Installation:",
        choice.outcome
    );


    kulzzyInstallPrompt =
        null;

};

/* =====================================================
AFTER INSTALLATION
===================================================== */

window.addEventListener(
    "appinstalled",
    function(){

        kulzzyInstallPrompt =
            null;


        console.log(
            "Kulzzy Radio installed successfully"
        );

    }
);

</script>
