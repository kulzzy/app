<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#06152B"><title>Kulzzy Radio Network</title><link rel="manifest" href="./manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png"><link rel="preconnect" href="https://kulzzy.github.io" crossorigin>
<link rel="dns-prefetch" href="//kulzzy.github.io"><style>
* {
    box-sizing: border-box;
}

html {
    overscroll-behavior-y: auto;
}

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: auto;
    min-height: calc(100dvh + 1px);
    overflow-x: hidden;
    overflow-y: auto;
    overscroll-behavior-y: auto;
    touch-action: pan-y;
    font-family: Arial, Helvetica, sans-serif;
    background: #020d1a url("./kulzzy-listeners-background.png") center center / cover no-repeat fixed;
}

/* FULL-PAGE BACKGROUND */

body::before {
    content: "";
    position: fixed;
    inset: 0;
    background: url("./kulzzy-listeners-background.png") center center / cover no-repeat;
    z-index: 0;
    pointer-events: none;
}

/* MAIN NAVIGATION */

#kulzzyMainNavigationFrame {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: calc(100vh - 109px);
    height: calc(100dvh - 109px);
    border: 0;
    display: block;
    z-index: 1000;
    background: transparent;
}

/* BOTTOM RADIO PLAYER */

#kulzzyFloatingRadio {
    position: fixed;
    left: 0;
    bottom: 0;
    width: 100%;
    height: 109px;
    z-index: 999999999;
    background: #020d1a;
    border-top: 3px solid #ffd000;
    box-shadow: 0 -4px 15px rgba(0,0,0,.65);
    overflow: hidden;
}

.kulzzyFloatRow {
    width: 100%;
    height: 106px;
    display: flex;
    align-items: stretch;
}

.kulzzyFloatPlayer {
    flex: 1;
    min-width: 0;
    height: 106px;
    background: #020d1a;
}

.kulzzyFloatPlayer iframe {
    width: 100%;
    height: 100%;
    border: 0;
    display: block;
}

.kulzzyFloatListeners {
    width: 180px;
    min-width: 180px;
    height: 106px;
    background: #020d1a;
    border-left: 2px solid #ffd000;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 5px;
}

.kulzzyFloatListenerTitle {
    color: white;
    font-size: 11px;
    font-weight: bold;
    white-space: nowrap;
}

.kulzzyFloatDot {
    display: inline-block;
    width: 10px;
    height: 10px;
    background: red;
    border-radius: 50%;
    margin-right: 5px;
    animation: kulzzyFloatBlink 1s infinite;
}

.kulzzyFloatNumber {
    color: #ff0015;
    font-size: 36px;
    font-weight: 900;
    line-height: 1;
    margin-top: 5px;
}

@keyframes kulzzyFloatBlink {
    0%, 100% {
        opacity: 1;
        box-shadow: 0 0 6px red, 0 0 15px red;
    }

    50% {
        opacity: .25;
        box-shadow: 0 0 10px red, 0 0 25px red;
    }
}

/* MOBILE */

@media (max-width: 650px) {

    #kulzzyMainNavigationFrame {
        height: calc(100vh - 109px);
        height: calc(100dvh - 109px);
    }

    #kulzzyFloatingRadio {
        height: 109px;
        border-top-width: 3px;
    }

    .kulzzyFloatRow {
        height: 106px;
    }

    .kulzzyFloatPlayer {
        width: 72%;
        height: 106px;
        flex: none;
    }

    .kulzzyFloatListeners {
        width: 28%;
        min-width: 28%;
        height: 106px;
        padding: 4px 2px;
        border-left: 2px solid #ffd000;
    }

    .kulzzyFloatListenerTitle {
        font-size: 10px;
        white-space: normal;
    }

    .kulzzyFloatDot {
        width: 8px;
        height: 8px;
        margin-right: 3px;
    }

    .kulzzyFloatNumber {
        font-size: 30px;
        margin-top: 5px;
    }
}

@media (max-width: 380px) {

    .kulzzyFloatListenerTitle {
        font-size: 9px;
    }

    .kulzzyFloatNumber {
        font-size: 26px;
    }
}
</style></head><body><!-- MAIN NAVIGATION --><iframe
    id="kulzzyMainNavigationFrame"
    title="Kulzzy Radio Main Navigation"
    src="https://kulzzy.github.io/KRN-NAVIGATION-BAR/"
    loading="eager"
    allow="autoplay; clipboard-write; encrypted-media; fullscreen">
</iframe><!-- FLOATING RADIO PLAYER --><div id="kulzzyFloatingRadio"><div class="kulzzyFloatRow">

    <div class="kulzzyFloatPlayer">
        <iframe
            src="https://kulzzy.github.io/KULZZY-AUTO-PLAYER/"
            title="Kulzzy Radio Network Audio Player"
            allow="autoplay"
            scrolling="no">
        </iframe>
    </div>

    <div class="kulzzyFloatListeners">
        <div>

            <div class="kulzzyFloatListenerTitle">
                <span class="kulzzyFloatDot"></span>
                OUR LISTENERS
            </div>

            <div id="kulzzyFloatingListenerNumber"
                 class="kulzzyFloatNumber">0</div>

        </div>
    </div>

</div>

</div><!-- LISTENER DISPLAY --><script>
(function () {
    var count = Math.floor(Math.random() * 9000) + 1000;

    var display = document.getElementById(
        "kulzzyFloatingListenerNumber"
    );

    if (!display) return;

    display.textContent = count.toLocaleString();

    setInterval(function () {
        var increase = Math.random() > 0.5;
        var change = (Math.floor(Math.random() * 8) + 1) * 10;

        if (increase) {
            count += change;
        } else {
            count -= change;
        }

        if (count < 1000) count = 1000;
        if (count > 9999) count = 9999;

        display.textContent = count.toLocaleString();
    }, 4000);
})();
</script><!-- PWA INSTALLATION AND AUTOMATIC UPDATES --><script>
let kulzzyInstallPrompt = null;

window.addEventListener("beforeinstallprompt", function (event) {
    event.preventDefault();
    kulzzyInstallPrompt = event;
});

if ("serviceWorker" in navigator) {
    window.addEventListener("load", async function () {
        try {
            const registration =
                await navigator.serviceWorker.register("./sw.js", {
                    scope: "./"
                });

            registration.update();

            setInterval(function () {
                registration.update();
            }, 60000);

            registration.addEventListener("updatefound", function () {
                const newWorker = registration.installing;

                if (!newWorker) return;

                newWorker.addEventListener("statechange", function () {
                    if (
                        newWorker.state === "installed" &&
                        navigator.serviceWorker.controller
                    ) {
                        newWorker.postMessage({
                            type: "SKIP_WAITING"
                        });
                    }
                });
            });

        } catch (error) {
            console.error(
                "Service Worker registration failed:",
                error
            );
        }
    });
}

let kulzzyRefreshing = false;

if ("serviceWorker" in navigator) {
    navigator.serviceWorker.addEventListener(
        "controllerchange",
        function () {
            if (kulzzyRefreshing) return;

            kulzzyRefreshing = true;
            window.location.reload();
        }
    );
}

window.kulzzyInstallApp = async function () {
    if (!kulzzyInstallPrompt) {
        alert(
            "Open your browser menu ⋮ and select " +
            "'Install app' or 'Add to Home screen'."
        );
        return;
    }

    try {
        kulzzyInstallPrompt.prompt();

        const choice = await kulzzyInstallPrompt.userChoice;

        console.log("Installation:", choice.outcome);

        kulzzyInstallPrompt = null;

    } catch (error) {
        console.error("Installation error:", error);
    }
};

window.addEventListener("appinstalled", function () {
    kulzzyInstallPrompt = null;

    try {
        localStorage.setItem("kulzzyRadioInstalled", "true");
    } catch (error) {}
});
</script><script src="./install.js"></script></body>
</html>
